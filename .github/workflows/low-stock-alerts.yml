name: Low stock alerts

# Back on, now a manual run has been seen to work end to end. It stayed off
# while the job was still failing: all it achieved then was emailing the
# repository owner "your workflow failed" every few hours, noise that read
# like stock alerts and buried the real problem.
#
# GitHub does not promise a scheduled run starts on the minute; under load
# it can be a good deal later. Fine for "send more paint".
# Hourly, not every fifteen minutes. Asking for less gets more here: GitHub
# deprioritises scheduled workflows on free public repositories, and the
# more often one asks the more runs are quietly dropped. Every fifteen
# minutes produced runs three to seven hours apart, then a twelve hour gap.
#
# This is not, and with a scheduled job cannot be, immediate. If stock
# needs to raise the alarm the moment it crosses the line, the trigger has
# to come from the database rather than from a clock over here.
#
# repository_dispatch is the database poking this the instant stock crosses
# its reorder level, which is what makes a notification arrive in seconds.
# The hourly sweep stays as the safety net: a poke that never lands is
# caught by the next one, and the told-once flag means neither path can
# send the same warning twice.
on:
  repository_dispatch:
    types: [low-stock]
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List what would be sent, send nothing'
        type: boolean
        default: false

# Two runs at once would race to stamp the same product and could send the
# same warning twice. Let a run finish before the next starts.
concurrency:
  group: low-stock-alerts
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web-push
        run: npm install web-push@3.6.7 --no-save --no-audit --no-fund

      - name: Send
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node tools/send-low-stock-alerts.mjs
